name: tabby_flutter_inapp_sdk
description: Flutter SDK for Tabby Buy Now, Pay Later. A package that allows you to integrate Tabby payment methods into your Flutter app.
version: 2.0.0
homepage: https://github.com/tabby-ai/tabby_flutter_inapp_sdk

environment:
  sdk: ">=2.15.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Remote API
  http: ^1.2.2

  # Webview
  webview_flutter: ^4.2.2
  webview_flutter_wkwebview: ^3.22.1
  webview_flutter_android: ^4.10.0
  webview_flutter_platform_interface: ^2.14.0

  # UUID
  uuid: ^4.5.0

  # Permissions
  permission_handler: ^11.4.0
  image: ^4.5.4
  image_picker: ^1.1.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0
  test: ^1.21.1
flutter:
  assets:
    - assets/images/tabby-badge.png
    - assets/images/2.0x/tabby-badge.png
    - assets/images/3.0x/tabby-badge.png
    - assets/images/r1.png
    - assets/images/r2.png
    - assets/images/r3.png
    - assets/images/r4.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
    - family: Arial
      fonts:
        - asset: assets/fonts/Arial-Regular.ttf
          weight: 500
